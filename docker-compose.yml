# Defining all our services
services:

  # Kafka Service
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092" # External host access
      - "9093:9093" # Internal cluster communication
    
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1 # Unique node identifier to identify each server in the cluster (broker, controller)
      KAFKA_PROCESS_ROLES: broker,controller # broker = storage layer where messages are stored, controller = manages the state of the cluster
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # <node_id>@<container>:<internal port>

      # Listeners 
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 # Where the broker should be listening (external cluster port)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
 
      # Topic Defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

      # Config for throughout
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    
      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data 

      # Cluster ID
      CLUSTER_ID: "MkU55EVBNTcwNTJENDM9Qk"

    # Networks
    # Needs to be running on the same network as flink
    networks:
      - flink-network

    # Defining the storage volume
    volumes:
    - kafka_data:/var/lib/kafka/data

    # Health check of the cluster 
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Defining the KAFKA UI service to access locally
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - flink-network

  python-producer:
    build: /Users/andrewswan/Documents/projects/real-time-financial/src/producer # Points to the directory containing your Dockerfile
    depends_on:
      kafka:
        condition: service_healthy  # Waits for the Kafka healthcheck to pass
    environment:
      - KAFKA_BROKER=kafka:9092
      - TOPIC_NAME=polling-weather
    networks:
      - flink-network
    restart: on-failure

  # Job manager service for flink
  jobmanager:
    image: apache/flink:1.20-scala_2.12
    container_name: flink-jobmanager
    user: root
    ports:
      - "8081:8081" # Flink Web UI
    command: >
      bash -c "
        mkdir -p /opt/flink/checkpoints /opt/flink/savepoints &&
        /docker-entrypoint.sh jobmanager
      "
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        state.backend: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints 
        state.savepoints.dir: file:///opt/flink/savepoints
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      # Don't need to chmod the directories since the volume mount already owns the dir
    networks:
      - flink-network 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Taskmanager service for flink
  taskmanager:
    image: apache/flink:1.20-scala_2.12
    container_name: flink-taskmanager
    user: root
    command: >
      bash -c "
        mkdir -p /opt/flink/checkpoints /opt/flink/savepoints &&
        /docker-entrypoint.sh taskmanager
      "
    depends_on:
      kafka: 
        condition: service_healthy
      jobmanager:
        condition: service_healthy
      
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1728m
        task.numberOfTaskSlots: 4 
      # numberOfTaskSlots = Set to number of CPU cores per TM
      # --scale taskmanager=N is the easiest way to scale and add more workers
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    networks:
      - flink-network 
    deploy:
      replicas: 1

volumes:
  kafka_data:
    driver: local
  flink-checkpoints:
  flink-savepoints:

networks:
  flink-network:
    driver: bridge